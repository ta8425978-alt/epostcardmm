<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asking You 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e9;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 90%;
            position: relative;
        }
        .gif {
            width: 150px;
            height: 150px;
        }
        h1 {
            color: #ff4d6d;
            font-size: 22px;
            margin: 15px 0;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #noBtn {
            background-color: #cccccc;
            color: #333;
            position: absolute;
            right: 40px;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <img class="gif" id="emoji" src="https://media.giphy.com/media/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="cute bear">
        <h1 id="question">ငါတို့ ပြန်တွဲကြမလား? 🥺👉👈</h1>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="acceptProposal()">Yes 💖</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 💔</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function acceptProposal() {
            document.getElementById('question').innerText = "Yay! ပျော်လိုက်တာ 🥰💖✨";
            document.getElementById('emoji').src = "https://media.giphy.com/media/26hpUre317gEiaq80/giphy.gif";
            document.querySelector('.btn-group').style.display = 'none';
        }
    </script>

</body>
</html>
