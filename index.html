<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special One 💕</title>
    <!-- Canvas Confetti Library for Fireworks/Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }
        /* Floating Hearts Animation */
        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: float 6s linear infinite;
            bottom: -30px;
            z-index: 1;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(214, 51, 108, 0.2);
            max-width: 380px;
            width: 88%;
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 2px solid #fff;
        }
        .gif-container img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            border-radius: 15px;
        }
        h1 {
            color: #ff3366;
            font-size: 22px;
            margin: 20px 0 10px 0;
            line-height: 1.4;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            min-height: 60px;
            position: relative;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        #yesBtn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            z-index: 2;
        }
        #yesBtn:hover {
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #f1f2f6;
            color: #57606f;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div id="hearts-container"></div>

    <div class="card" id="card">
        <div class="gif-container">
            <img id="emoji" src="https://media.giphy.com/media/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="cute bear">
        </div>
        <h1 id="question">ငါတို့ ပြန်တွဲကြမလား? 🥺👉👈</h1>
        <p class="subtitle" id="subtitle">စိတ်ထဲရှိတာ အမှန်အတိုင်း နှိပ်နော် 💕</p>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="acceptProposal()">Yes 💖</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 💔</button>
        </div>
    </div>

    <script>
        // Floating Hearts Background Effect
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);

        // Fun text array for No Button
        const noTexts = ["တကယ်လား? 🥺", "ထပ်စဉ်းစားပါဦး 😭", "မရဘူး Yes ပဲနှိပ် 😜", "နှိပ်လို့မရဘူးလေ ✨", "ချစ်တယ်မလား? ❤️"];
        let textIndex = 0;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // Change text dynamically
            noBtn.innerText = noTexts[textIndex];
            textIndex = (textIndex + 1) % noTexts.length;
        }

        function acceptProposal() {
            // Trigger Confetti Party Explosion
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            document.getElementById('question').innerText = "Yay! ပျော်လိုက်တာ 🥰💖✨";
            document.getElementById('subtitle').innerText = "အမြဲတမ်း အတူတူရှိပေးမယ်နော်! ❤️";
            document.getElementById('emoji').src = "https://media.giphy.com/media/26hpUre317gEiaq80/giphy.gif";
            document.querySelector('.btn-group').style.display = 'none';
        }
    </script>

</body>
</html>
